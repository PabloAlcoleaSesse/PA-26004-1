name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      container_smoke:
        description: Run the optional container smoke test
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format, vet, race tests, and build
        run: make check
      - name: Start application
        if: github.event_name == 'workflow_dispatch' && inputs.container_smoke
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Check HTTP and background processing
        if: github.event_name == 'workflow_dispatch' && inputs.container_smoke
        run: |
          curl --fail http://127.0.0.1:8080/healthz
          curl --fail http://127.0.0.1:8080/readyz
          docker compose exec -T worker /app/admin probe
          docker compose run --rm migrate
      - name: Container logs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.container_smoke
        run: docker compose logs --no-color
      - name: Stop application
        if: always() && github.event_name == 'workflow_dispatch' && inputs.container_smoke
        run: docker compose down
